version: '3.8'

services:
  emergency-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_emergency_system
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your shell or .env before starting}
      - FRONTEND_URL=http://localhost:4000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
