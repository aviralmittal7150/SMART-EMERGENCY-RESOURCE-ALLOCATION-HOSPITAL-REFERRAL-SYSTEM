name: Smart Emergency System CI Pipeline

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Node Test & Concurrency Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Unit & Concurrency Test Automation Suite
        run: npm test

      - name: Concurrency Stress Test Suite (Issue #24 / P3-01)
        run: npm run test:concurrency

      - name: Banker's Compound Deadlock Engine Suite (Issue #25 / P3-02)
        run: npm run test:compound

      - name: Medico-Legal Sealed Audit Ledger Suite (Issue #27 / P3-04)
        run: npm run test:audit

  docker-build-check:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: smart-emergency-system:ci-test
