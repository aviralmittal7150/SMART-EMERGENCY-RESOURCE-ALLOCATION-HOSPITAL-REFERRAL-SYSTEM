name: Smart Emergency System CI Pipeline

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

# Least privilege: nothing in this workflow needs more than read access to the repository.
permissions:
  contents: read

jobs:
  test-and-verify:
    name: Node Test & Concurrency Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    # A disposable MySQL for every matrix leg (service containers are per job, so the Node 20 and
    # Node 22 legs cannot interfere). Nothing here is a real credential: root has an empty password
    # inside a container that only this runner can reach, and the test user created below gets a random
    # password generated at run time (masked in the logs, never stored in the repository).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # The MySQL suites must really run in CI. With this set, a missing or unreachable test database
      # FAILS the build instead of letting those suites skip.
      REQUIRE_MYSQL_TESTS: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Ensure the MySQL client is available
        run: command -v mysql >/dev/null || (sudo apt-get update && sudo apt-get install -y mysql-client)

      - name: Prepare the disposable MySQL test database
        env:
          MYSQL_ADMIN_HOST: 127.0.0.1
          MYSQL_ADMIN_PORT: '3306'
          MYSQL_TEST_DB: emergency_system_test
          MYSQL_TEST_USER: eris_test
        # Waits for readiness, creates the database + a restricted user with a random password, and
        # appends MYSQL_TEST_HOST/PORT/USER/PASS/DB to $GITHUB_ENV for the later steps.
        run: ENV_OUT="$GITHUB_ENV" bash scripts/prepare-mysql-test-db.sh

      # Linux MySQL treats table names as case-sensitive (macOS/Windows installs usually do not), so a
      # wrongly cased table name only fails here. Verify the server really is 8.4 with that behaviour.
      - name: Verify MySQL 8.4 with case-sensitive table names
        run: |
          read -r version lower_case < <(MYSQL_PWD="$MYSQL_TEST_PASS" mysql --protocol=TCP -h "$MYSQL_TEST_HOST" \
            -P "$MYSQL_TEST_PORT" -u "$MYSQL_TEST_USER" -N -e 'SELECT VERSION(), @@lower_case_table_names')
          echo "MySQL ${version}, lower_case_table_names=${lower_case}"
          [[ "$version" == 8.4.* ]] || { echo "::error::expected MySQL 8.4, got ${version}"; exit 1; }
          [[ "$lower_case" == "0" ]] || { echo "::error::table names must be case-sensitive (lower_case_table_names=0)"; exit 1; }

      - name: Initialise the schema and demo data with the project's own tooling
        run: |
          export DB_USE_MEMORY=false DB_HOST="$MYSQL_TEST_HOST" DB_PORT="$MYSQL_TEST_PORT" \
                 DB_NAME="$MYSQL_TEST_DB" DB_USER="$MYSQL_TEST_USER" DB_PASS="$MYSQL_TEST_PASS"
          npm run db:init
          npm run db:seed
          # Behavioural proof of case sensitivity: the table is `Hospital`; `hospital` must not resolve.
          if MYSQL_PWD="$MYSQL_TEST_PASS" mysql --protocol=TCP -h "$MYSQL_TEST_HOST" -P "$MYSQL_TEST_PORT" \
               -u "$MYSQL_TEST_USER" "$MYSQL_TEST_DB" -N -e 'SELECT COUNT(*) FROM hospital' 2>/dev/null; then
            echo "::error::lower-case table name resolved: the server is not case-sensitive"; exit 1
          fi

      - name: Migration runner on the freshly initialised database (status, then a no-op apply)
        run: |
          export DB_USE_MEMORY=false DB_HOST="$MYSQL_TEST_HOST" DB_PORT="$MYSQL_TEST_PORT" \
                 DB_NAME="$MYSQL_TEST_DB" DB_USER="$MYSQL_TEST_USER" DB_PASS="$MYSQL_TEST_PASS"
          npm run db:migrate -- --status
          npm run db:migrate | tee migrate-output.log
          grep -q 'schema is up to date' migrate-output.log

      - name: Run Full Unit & Concurrency Test Automation Suite (MySQL required)
        run: |
          npm test | tee test-output.log
          # The MySQL suites must have really run: no skipped tests, no failures.
          grep -qx '# skipped 0' test-output.log
          grep -qx '# fail 0' test-output.log

      # The real mass-casualty harness (sim/): every safety invariant and the lock order are checked after
      # each phase against MySQL; the step fails on any violation or unexpected error.
      - name: Mass-casualty stress harness smoke (MySQL, Issue #24 / P3-01)
        run: npm run sim:smoke

      # Legacy test of the in-memory mutex only (tests/concurrency_stress.test.js); kept for continuity.
      - name: Legacy in-memory mutex concurrency test (tests/concurrency_stress.test.js)
        run: npm run test:concurrency

      - name: Banker's Compound Deadlock Engine Suite (Issue #25 / P3-02)
        run: npm run test:compound

      - name: Medico-Legal Sealed Audit Ledger Suite (Issue #27 / P3-04)
        run: npm run test:audit

  docker-build-check:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: smart-emergency-system:ci-test
